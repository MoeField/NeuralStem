name: Publish F-Droid repo

# 发布 GitHub Release 后，自动用 release 里的 arm64 APK 更新自建 F-Droid 源。
#
# 需要的 Repository Secrets：
#   FDROID_KEYSTORE_BASE64   repo 签名 keystore（fdroid/local/keystore.p12）的 base64
#   FDROID_KEYSTORE_PASSWORD repo keystore 密码
#   FDROID_KEY_ALIAS         repo key alias（fdroid/local/config.yml 的 repo_keyalias）
#   FDROID_KEY_PASSWORD      repo key 密码；省略时回退到 FDROID_KEYSTORE_PASSWORD
#
# 没有 secret 时会在第一步直接失败，不会生成/替换签名 key。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 release tag，例如 v0.2.28"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fdroid-repo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
      FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
      FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
      FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
      # 当前 App release 证书 SHA-256；如需轮换 release key，同时更新这个 variable。
      EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 || '85a5c9ebbfc867d01ccdac83a49411aad17c6fb7c42fef9b7d3a2e9b861e0d6e' }}

    steps:
      - name: Validate tag/secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAG:-}" || { echo "::error::TAG 为空"; exit 1; }
          [[ "$TAG" == v* ]] || { echo "::error::tag 必须以 v 开头：$TAG"; exit 1; }
          test -n "${FDROID_KEYSTORE_BASE64:-}" || { echo "::error::缺少 Secret FDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${FDROID_KEYSTORE_PASSWORD:-}" || { echo "::error::缺少 Secret FDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${FDROID_KEY_ALIAS:-}" || { echo "::error::缺少 Secret FDROID_KEY_ALIAS"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          # release 创建和 asset 上传有短暂窗口；最多等 2 分钟。
          for i in $(seq 1 24); do
            if gh release download "$TAG" \
                --pattern "app-arm64-v8a-release.apk" \
                --dir "$RUNNER_TEMP/apk" --clobber; then
              break
            fi
            echo "release asset 尚未可用，等待重试 ($i/24)"
            sleep 5
          done
          test -f "$RUNNER_TEMP/apk/app-arm64-v8a-release.apk"
          ls -lh "$RUNNER_TEMP/apk/app-arm64-v8a-release.apk"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # keytool（校验 keystore）和 fdroid 索引签名都需要 Java。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install fdroidserver + build-tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "fdroidserver==2.4.5"
          # GitHub hosted runner 自带 Android SDK，和 android-ci.yml 用同一路径；
          # 不再依赖 android-actions/setup-android（Node 20 action 已失效）。
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          test -n "$SDKM" || { echo "::error::找不到 sdkmanager"; exit 1; }
          "$SDKM" --version
          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "build-tools;35.0.0" >/dev/null
          fi
          AAPT_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$AAPT_DIR/aapt"
          echo "$AAPT_DIR" >> "$GITHUB_PATH"
          echo "AAPT_DIR=$AAPT_DIR" >> "$GITHUB_ENV"

      - name: Validate release APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk/app-arm64-v8a-release.apk"
          EXPECTED_VERSION="${TAG#v}"
          APK_VERSION=$("$AAPT_DIR/aapt" dump badging "$APK" \
            | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "release tag: $TAG"
          echo "APK versionName: $APK_VERSION"
          if [ "$APK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::APK versionName ($APK_VERSION) != tag ($EXPECTED_VERSION)"
            exit 1
          fi
          CERT_SHA=$("$AAPT_DIR/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)
          echo "APK signer: $CERT_SHA"
          if [ "$CERT_SHA" != "$EXPECTED_APK_CERT_SHA256" ]; then
            echo "::error::APK 签名证书不匹配（期望 $EXPECTED_APK_CERT_SHA256）"
            echo "::error::很可能是 release secrets 缺失导致 debug 签名；拒绝发布"
            exit 1
          fi

      - name: Restore repo signing key + config
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/fdroid-keystore.p12"
          # secret 在复制/粘贴时可能带 CRLF/空格/URL-safe 字符或丢掉 padding。
          B64=$(printf '%s' "$FDROID_KEYSTORE_BASE64" | tr -d ' %\r\n\t' | tr '_-' '/+')
          case $(( ${#B64} % 4 )) in
            2) B64="${B64}==" ;;
            3) B64="${B64}=" ;;
          esac
          echo "base64 chars: ${#B64}"
          if ! printf '%s' "$B64" | base64 -d > "$KEYSTORE"; then
            echo "::error::FDROID_KEYSTORE_BASE64 不是合法 base64（请填 keystore.p12 的 base64，不要填文件路径/密码）"
            exit 1
          fi
          test -s "$KEYSTORE" || { echo "::error::keystore 解码结果为空"; exit 1; }
          chmod 600 "$KEYSTORE"
          echo "keystore decoded: $(wc -c < "$KEYSTORE") bytes"
          # 提前验证密码和 alias，避免直到 fdroid update 才报模糊错误。
          if ! keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass:env FDROID_KEYSTORE_PASSWORD -alias "$FDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::keystore 密码或 FDROID_KEY_ALIAS 不正确"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fdroid-work/repo" "$RUNNER_TEMP/fdroid-work/metadata"
          python3 - "$KEYSTORE" "$RUNNER_TEMP/fdroid-work/config.yml" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          keystore, config = sys.argv[1], sys.argv[2]
          key_password = os.environ.get("FDROID_KEY_PASSWORD") or os.environ["FDROID_KEYSTORE_PASSWORD"]
          fields = {
              "sdk_path": os.environ["ANDROID_HOME"],
              "repo_url": "https://neuralstem.miku.pub/fdroid/repo",
              "repo_name": "NeuralStem",
              "repo_description": "NeuralStem 自建源：离线分轨、播放与导出",
              "repo_keyalias": os.environ["FDROID_KEY_ALIAS"],
              "keystore": keystore,
              "keystorepass": os.environ["FDROID_KEYSTORE_PASSWORD"],
              "keypass": key_password,
              "keydname": "CN=neuralstem-repo, OU=F-Droid",
          }
          # JSON 字符串是合法 YAML 标量，同时避免密码里的 :/# 等字符破坏 YAML。
          Path(config).write_text(
              "\n".join(f"{k}: {json.dumps(v)}" for k, v in fields.items()) + "\n"
          )
          # fdroid 会警告 config 权限过宽；runner 上是临时的，顺手收紧。
          Path(config).chmod(0o600)
          PY

      - name: Prepare repo from latest gh-pages
        shell: bash
        run: |
          set -euo pipefail
          PAGES="$RUNNER_TEMP/fdroid-pages"
          WORK="$RUNNER_TEMP/fdroid-work"
          git fetch origin gh-pages
          git worktree add --detach "$PAGES" origin/gh-pages
          # 保留已有图标/index；只替换 APK，避免同版本重复。
          cp -a "$PAGES/fdroid/repo/." "$WORK/repo/"
          find "$WORK/repo" -maxdepth 1 -name 'pub.miku.neuralstem_*.apk' -delete
          cp "$RUNNER_TEMP/apk/app-arm64-v8a-release.apk" "$WORK/repo/"
          cp fdroid/metadata/*.yml "$WORK/metadata/"
          ls -lh "$WORK/repo" | head

      - name: Generate signed index
        shell: bash
        working-directory: ${{ runner.temp }}/fdroid-work
        run: |
          set -euo pipefail
          fdroid update --create-metadata --rename-apks

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          PAGES="$RUNNER_TEMP/fdroid-pages"
          WORK="$RUNNER_TEMP/fdroid-work"
          rm -rf "$PAGES/fdroid/repo"
          mkdir -p "$PAGES/fdroid/repo"
          cp -a "$WORK/repo/." "$PAGES/fdroid/repo/"
          cd "$PAGES"
          git config user.name "NeuralStem F-Droid Bot"
          git config user.email "fdroid-bot@users.noreply.github.com"
          git add fdroid/repo
          if git diff --cached --quiet; then
            echo "repo 无变化，跳过提交"
            exit 0
          fi
          git commit -m "publish: NeuralStem F-Droid repo $TAG"
          git push origin HEAD:gh-pages
          echo "published: $TAG"
