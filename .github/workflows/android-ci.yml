name: Android CI

# 轻量 CI：只跑 :app 的 JVM 单元测试。
# 不用 setup-android action（其在全新 runner 上装 cmdline-tools 偶发失败），
# 直接使用 ubuntu-latest 预装的 Android SDK + sdkmanager。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate SDK + sdkmanager
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -d "$ANDROID_SDK_ROOT" || true
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "found sdkmanager=$SDKM"
          if [ -z "$SDKM" ]; then
            echo "::error::runner 上没有 cmdline-tools/sdkmanager"; exit 1
          fi
          echo "$SDKM" > /tmp/sdkm.path
          "$SDKM" --version

      - name: Install stable SDK 36 (explicit + assert)
        run: |
          SDKM=$(cat /tmp/sdkm.path)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "--- platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36" || { echo "::error::android-36 未安装"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          ls "$ANDROID_SDK_ROOT/platforms"
          ./gradlew --version

      - name: Unit tests (compileSdk 36 override)
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false \
            -PciCompileSdk=36

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
