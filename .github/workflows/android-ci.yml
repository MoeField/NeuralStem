name: Android CI (unit tests)

# B 版轻量 CI：只跑 JVM 单元测试（不编 APK、不装 NDK/CMake、不编 bench）。
# 目的：保证每次提交「代码没坏」。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # 尝试安装 API 37（预览）。装不上就降级用 36（脚本后续按实际情况传 -PciCompileSdk）。
      - name: Install SDK (37 preview → fallback 36) + build-tools
        id: sdk
        run: |
          set +e
          sdkmanager --list --channel=3 2>/dev/null | grep -iE "platforms;android-3[6-9]" | head -20
          installed37=0
          for pkg in "platforms;android-37" "platforms;android-37.0"; do
            if sdkmanager --channel=3 "$pkg" >/dev/null 2>&1; then installed37=1; echo "installed $pkg"; break; fi
          done
          if [ "$installed37" = "1" ]; then
            sdkmanager "build-tools;37.0.0" >/dev/null 2>&1 || true
            echo "compile_sdk_arg=" >> "$GITHUB_OUTPUT"
            echo "SDK 37 installed"
          else
            echo "::warning::API 37 预览包不可用，降级 compileSdk 36 跑单测"
            sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
            echo "compile_sdk_arg=-PciCompileSdk=36" >> "$GITHUB_OUTPUT"
          fi
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Print env
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ./gradlew --version || true

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false \
            ${{ steps.sdk.outputs.compile_sdk_arg }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
