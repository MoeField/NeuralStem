name: Android CI (unit tests)

# B 版轻量 CI：只跑 JVM 单元测试（不编 APK、不装 NDK/CMake、不编 bench）。
# 目的：保证每次提交「代码没坏」。完整 APK 构建见 beta 阶段的升级计划。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 21：Gradle 9.x / AGP 9.x 均支持；并用 auto-download=false 关掉 toolchain 自动下载
      # （本地曾因 foojay 插件尝试下载 JDK 25 而卡死，CI 必须显式禁用）。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # compileSdk=37 目前只有预览版（Cinnamon Bun，包名可能与最终版不同）。
      # 这里装预览渠道平台 + build-tools；若将来看到该包改名，改这一行即可。
      - name: Install SDK platform 37 (preview) + build-tools
        run: |
          sdkmanager --channel=3 "platforms;android-37" || \
          sdkmanager --channel=3 "platforms;android-37.0" || \
          (echo "::warning::未能安装 android-37（预览），尝试继续" )
          sdkmanager "build-tools;37.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 只跑 :app 的单测（150 项，全部是 JVM 测试，用假分离器，不依赖真实模型）。
      # 不编 bench（含 QNN 大 so，体积大、耗时长）。
      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
