name: Android CI

# 轻量 CI：只跑 :app 的 JVM 单元测试。
# 不装 NDK/CMake、不编 bench、不出 APK（这些留给本地 / beta 阶段）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 只装 sdkmanager 本身（不靠它的 packages 输入，那段曾静默没装上导致 AGP 找不到 android-36）。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 显式安装 + 断言，装不上就直接失败（而不是让 AGP 报 “Failed to find target android-36”）。
      - name: Install stable SDK 36 (explicit + assert)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "--- platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36" || (echo "::error::android-36 未安装成功"; exit 1)

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          echo "SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"
          ./gradlew --version

      - name: Unit tests (compileSdk 36 override)
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false \
            -PciCompileSdk=36

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
