name: Android CI

# 轻量 CI：只跑 :app 的 JVM 单元测试。
# 注意：本项目 compileSdk=37（当前为预览版 Cinnamon Bun），无法降到 36 ——
# 多个 AndroidX 依赖要求 compileSdk>=37（会触发 checkDebugAarMetadata 失败）。
# 所以 CI 必须装到 37（preview channel）。

on:
  push:
    branches: [ main ]
    # ★打 tag（v1.2.3）也触发 → build-apk job 会额外发 GitHub Release。
    #   注意：`branches` 与 `tags` 是**并列**过滤条件（不是 AND）：
    #   push 到 main 或推送 tag 任一满足即触发。
    tags: [ 'v*' ]
    # 文档 / 报告 / 图片等不涉代码的改动不触发构建（省 CI 时间）。
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'report/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      # NCM 模块默认不编译，CI 也不启用（-Pwith_ncm），其改动不影响构建结果
      - 'app/src/ncm/**'
      - 'app/src/ncmTest/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'report/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'app/src/ncm/**'
      - 'app/src/ncmTest/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ★发 Release 需要写权限。
# GitHub 对新建仓库的 GITHUB_TOKEN 默认为**只读** → softprops/action-gh-release 会 403
# （"Resource not accessible by integration"）。必须显式声明。
permissions:
  contents: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate sdkmanager
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::no sdkmanager"; exit 1; }
          echo "$SDKM" > /tmp/sdkm.path
          "$SDKM" --version

      # API 37 目前是预览版：需要 --channel=3，且包名可能是 android-37 或 android-37.0。
      - name: Install SDK 37 (preview) + build-tools
        run: |
          SDKM=$(cat /tmp/sdkm.path)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -x
          "$SDKM" --list --channel=3 2>/dev/null | grep -iE "platforms;android-3[6-9]" || true
          ok=0
          for pkg in "platforms;android-37" "platforms;android-37.0"; do
            if "$SDKM" --channel=3 --install "$pkg" >/dev/null 2>&1; then ok=1; echo "installed $pkg"; break; fi
          done
          if [ "$ok" = "0" ]; then echo "::error::无法安装 API 37 预览平台"; exit 1; fi
          "$SDKM" --channel=3 --install "build-tools;37.0.0" >/dev/null 2>&1 || "$SDKM" --channel=3 --install "build-tools;36.0.0" >/dev/null 2>&1 || true
          echo "--- platforms ---"; ls "$ANDROID_SDK_ROOT/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          ls "$ANDROID_SDK_ROOT/platforms"
          ./gradlew --version

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE "What went wrong|Caused by|error:|FAILED|> Could not|> Failed|requires|compileSdk" /tmp/gradle.log \
              | head -25 | while IFS= read -r line; do
                echo "::error::$(echo "$line" | tr -d '\r' | cut -c1-900)"
              done
          fi
          exit $rc

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # ★构建 APK（依赖单测通过）
  #
  # 产出（均在 app/build/outputs/apk/release/）：
  #   app-arm64-v8a-release.apk   ← 真机用（~26MB，推荐下载）
  #   app-x86_64-release.apk      ← 模拟器用
  #   app-universal-release.apk   ← 合包（~42MB，不确定架构时用）
  #
  # 签名（2026-10-20）：**正式签名**，从 Repository Secrets 解出 keystore。
  #   需要 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。
  #   缺失时自动回退 debug 签名（保证 fork / PR 的 CI 仍能跑）。
  # ============================================================
  build-apk:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate sdkmanager
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::no sdkmanager"; exit 1; }
          echo "$SDKM" > /tmp/sdkm.path

      - name: Install SDK 37 (preview) + build-tools + NDK + CMake
        run: |
          SDKM=$(cat /tmp/sdkm.path)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          ok=0
          for pkg in "platforms;android-37" "platforms;android-37.0"; do
            if "$SDKM" --channel=3 --install "$pkg" >/dev/null 2>&1; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo "::error::无法安装 API 37"; exit 1; }
          "$SDKM" --channel=3 --install "build-tools;37.0.0" >/dev/null 2>&1 \
            || "$SDKM" --channel=3 --install "build-tools;36.0.0" >/dev/null 2>&1 || true
          # 本项目的 ndkVersion / cmakeVersion 是写死的（见 app/build.gradle.kts）
          "$SDKM" --install "ndk;30.0.16248370" >/dev/null 2>&1 || echo "::warning::NDK install failed"
          "$SDKM" --install "cmake;4.1.2" >/dev/null 2>&1 || echo "::warning::CMake install failed"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # tag 构建时用 tag 名当版本号（v1.2.3 → 1.2.3）
      - name: Resolve version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=""
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "resolved version: '$V'"

      # ★正式签名（2026-10-20）：从 Repository Secrets 解出 keystore。
      #
      # 为何需要：debug 签名每台机器/每次 CI 都不同 → 用户**无法覆盖安装**升级，
      # F-Droid / Obtainium 的自动更新完全失效（它们靠签名一致判定“同一应用”）。
      #
      # 需要 4 个 Secret（Settings → Secrets and variables → Actions → Repository secrets）：
      #   KEYSTORE_BASE64   = base64 -i neuralstem.jks | pbcopy
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS         = neuralstem
      #   KEY_PASSWORD
      #
      # 缺失时**不报错**：app/build.gradle.kts 会回退 debug 签名并打印警告
      # （保证 fork / PR 的 CI 仍能跑）。
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/neuralstem.jks"
          ls -l "$RUNNER_TEMP/neuralstem.jks"
          echo "::notice::使用正式签名 keystore（$RUNNER_TEMP/neuralstem.jks）"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Ensure debug keystore exists (fallback)
        # 仅在**没有**正式密钥时用到（Gradle 会自动生成，显式先建一份更稳）。
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l ~/.android/debug.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: |
          set +e
          EXTRA=""
          if [ -n "${{ steps.ver.outputs.name }}" ]; then
            EXTRA="-PversionName=${{ steps.ver.outputs.name }}"
          fi
          # -x lintVital*：release 默认会跑 lintVital（需额外下载 lint-gradle 依赖，
          #   与本流水线目的无关，且会增加一次网络失败点）。
          ./gradlew :app:assembleRelease $EXTRA \
            -x lintVitalAnalyzeRelease -x lintVitalRelease \
            --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE "What went wrong|Caused by|error:|FAILED|> Could not|> Failed" /tmp/build.log \
              | head -25 | while IFS= read -r line; do
                echo "::error::$(echo "$line" | tr -d '\r' | cut -c1-900)"
              done
          fi
          exit $rc
        # ★四个变量供 app/build.gradle.kts 读取（无 keystore.properties 时用它）。
        # 缺失时 build.gradle.kts 的 hasReleaseSigning=false → 回退 debug。
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/neuralstem.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        # 把指纹写进 CI 日志 —— 以后排查“用户装不上更新”时可直接对比。
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*arm64*v8a*.apk" | head -1)
          if [ -n "$APKSIGNER" ] && [ -n "$APK" ]; then
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -E "certificate (DN|SHA-256)" || true
          else
            echo "::warning::未能定位 apksigner 或 APK，跳过签名校验"
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # ★发 Release（只在打 tag 时）：push tag v1.2.3 → 自动创建 Release 并附 APK
      #
      # 为何不每次 push main 都发：一次会话十几个 commit，Release 列表会被噪声填满。
      # 发布节奏由你控制：想发版就打 tag。
      # ============================================================
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          name: NeuralStem ${{ steps.ver.outputs.name }}
          body: |
            NeuralStem ${{ steps.ver.outputs.name }}

            **安装**：下载 `app-arm64-v8a-release.apk`（大多数手机）。
            模拟器用 `app-x86_64-release.apk`；不确定架构用 `app-universal-release.apk`。

            **首次使用**：打开 App → 设置 → 模型管理 → 下载 Spleeter 2 轨（~39MB）。

            **许可**：本项目 MIT；分离模型许可详见 [NOTICE](https://github.com/MoeField/NeuralStem/blob/main/NOTICE)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

