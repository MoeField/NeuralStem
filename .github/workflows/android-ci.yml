name: Android CI

# 轻量 CI：只跑 :app 的 JVM 单元测试。
# 注意：本项目 compileSdk=37（当前为预览版 Cinnamon Bun），无法降到 36 ——
# 多个 AndroidX 依赖要求 compileSdk>=37（会触发 checkDebugAarMetadata 失败）。
# 所以 CI 必须装到 37（preview channel）。

on:
  push:
    branches: [ main ]
    # 文档 / 报告 / 图片等不涉代码的改动不触发构建（省 CI 时间）。
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'report/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'report/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate sdkmanager
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::no sdkmanager"; exit 1; }
          echo "$SDKM" > /tmp/sdkm.path
          "$SDKM" --version

      # API 37 目前是预览版：需要 --channel=3，且包名可能是 android-37 或 android-37.0。
      - name: Install SDK 37 (preview) + build-tools
        run: |
          SDKM=$(cat /tmp/sdkm.path)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -x
          "$SDKM" --list --channel=3 2>/dev/null | grep -iE "platforms;android-3[6-9]" || true
          ok=0
          for pkg in "platforms;android-37" "platforms;android-37.0"; do
            if "$SDKM" --channel=3 --install "$pkg" >/dev/null 2>&1; then ok=1; echo "installed $pkg"; break; fi
          done
          if [ "$ok" = "0" ]; then echo "::error::无法安装 API 37 预览平台"; exit 1; fi
          "$SDKM" --channel=3 --install "build-tools;37.0.0" >/dev/null 2>&1 || "$SDKM" --channel=3 --install "build-tools;36.0.0" >/dev/null 2>&1 || true
          echo "--- platforms ---"; ls "$ANDROID_SDK_ROOT/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          ls "$ANDROID_SDK_ROOT/platforms"
          ./gradlew --version

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.auto-download=false 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE "What went wrong|Caused by|error:|FAILED|> Could not|> Failed|requires|compileSdk" /tmp/gradle.log \
              | head -25 | while IFS= read -r line; do
                echo "::error::$(echo "$line" | tr -d '\r' | cut -c1-900)"
              done
          fi
          exit $rc

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
