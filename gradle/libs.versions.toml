[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
documentFile = "1.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
tensorflowLite = "2.17.0"
tensorflowLiteSelectTfOps = "2.16.1"
coroutinesAndroid = "1.11.0"
lifecycleViewmodelCompose = "2.11.0"
media3 = "1.11.1"
# M4/S2: Demucs 4-stem 走自建 ORT 管线（sherpa 不支持 4-stem）
onnxruntimeAndroid = "1.22.0"
# M4 上限验证：带 QNN/XNNPACK EP 的 ORT（bench 模块专用，不引入主工程）
onnxruntimeQnn = "1.29.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# U5: 歌单文件夹导入（SAF Tree 递归扫描）
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentFile" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# [已废弃 Task 0g] TFLite 回退路线存档于 app/src/deprecated/,4KB 对齐不兼容 Android 15+;
# 保留定义仅便于将来恢复
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
tensorflow-lite-select-tf-ops = { group = "org.tensorflow", name = "tensorflow-lite-select-tf-ops", version.ref = "tensorflowLiteSelectTfOps" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
# V2 (guide N4): 后台播放 —— MediaSessionService + 媒体通知
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# M4/S2: ONNX Runtime Android（Demucs 4-stem 自建管线）
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntimeAndroid" }
# M4 上限验证：带 QNN/XNNPACK EP 的 ORT（仅 bench 模块）
onnxruntime-android-qnn = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android-qnn", version.ref = "onnxruntimeQnn" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

